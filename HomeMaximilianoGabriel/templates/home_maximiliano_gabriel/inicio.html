{% extends 'base.html' %}

{% block content %}
<div class="text-center mb-5">
    <h1 class="display-5 fw-bold">Catálogo de Películas</h1>
    <p class="lead text-muted">Selecciona una categoría para explorar sus películas disponibles.</p>
</div>

<div class="row g-4 justify-content-center">
    {% if generos %}
        {% for g in generos %}
        <div class="col-md-5">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h3 class="card-title fw-bold">{{ g.nombre }}</h3>
                    <p class="card-text text-secondary flex-grow-1">{{ g.descripcion }}</p>
                    <a href="{% url g.url_name %}" class="btn btn-primary mt-3">Ver películas</a>
                </div>
            </div>
        </div>
        {% endfor %}
    {% endif %}
</div>
{% endblock %}
